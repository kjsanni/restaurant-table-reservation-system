<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Fresh Sip</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="shared-styles.css">
    <style>
        .auth-layout { display: flex; min-height: 100vh; }
        .auth-brand {
            flex: 1; background: linear-gradient(135deg, var(--terracotta-700), var(--terracotta-800));
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            padding: 80px; color: var(--white); position: relative; overflow: hidden;
        }
        .auth-brand::before {
            content: ''; position: absolute; width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,255,255,0.08), transparent);
            border-radius: 50%; top: -150px; right: -150px;
            animation: float 8s ease-in-out infinite;
        }
        .auth-brand-img {
            width: 200px; height: 200px; border-radius: var(--radius-xl);
            object-fit: cover; margin-bottom: 32px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }
        .auth-brand h1 {
            font-size: 48px; margin-bottom: 16px; position: relative;
            animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
        }
        .auth-brand p {
            font-size: 17px; opacity: 0.9; max-width: 400px; position: relative;
            line-height: 1.7; animation: fadeUp 1s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
        }
        .auth-form {
            flex: 1; display: flex; align-items: center; justify-content: center;
            padding: 80px; background: var(--cream-50);
        }
        .auth-form-inner { width: 100%; max-width: 440px; }
        .auth-form-inner h2 {
            font-size: 32px; margin-bottom: 10px;
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
        }
        .auth-form-inner .subtitle {
            color: var(--brown-700); margin-bottom: 36px; opacity: 0.7;
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
        }
        .form-group {
            margin-bottom: 20px;
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
        }
        .form-group:nth-child(1) { animation-delay: 0.4s; }
        .form-group:nth-child(2) { animation-delay: 0.5s; }
        .form-group:nth-child(3) { animation-delay: 0.6s; }
        .form-group label {
            display: block; font-size: 13px; font-weight: 600;
            color: var(--brown-700); margin-bottom: 8px;
        }
        .form-group input {
            width: 100%; padding: 14px 18px;
            border: 2px solid rgba(62, 39, 35, 0.1);
            border-radius: var(--radius-md);
            font-family: var(--font-sans); font-size: 14px;
            background: var(--white); transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none; border-color: var(--terracotta-500);
            box-shadow: 0 0 0 4px rgba(232, 93, 58, 0.1);
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px 28px; border-radius: var(--radius-md); font-weight: 600;
            font-size: 14px; transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer; border: none; font-family: var(--font-sans);
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--terracotta-600), var(--terracotta-700));
            color: var(--white); width: 100%;
            box-shadow: 0 4px 16px rgba(232, 93, 58, 0.35);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(232, 93, 58, 0.45);
        }
        .auth-footer {
            text-align: center; margin-top: 28px; font-size: 14px;
            color: var(--brown-700); opacity: 0.7;
            animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.8s both;
        }
        .auth-footer a { color: var(--terracotta-700); font-weight: 600; }
        @media (max-width: 860px) {
            .auth-brand { display: none; }
            .auth-form { padding: 60px 28px; }
        }
    </style>
</head>
<body>
    <div class="auth-layout">
        <div class="auth-brand">
            <img src="assets/family-drinks.jpg" alt="Happy family enjoying Fresh Sip drinks" class="auth-brand-img">
            <h1>Fresh Sip</h1>
            <p>Ready-made drinks delivered fresh. Order via WhatsApp, pay with Paystack, track with ShaQ Express.</p>
        </div>
        <div class="auth-form">
            <div class="auth-form-inner">
                <h2>Welcome back</h2>
                <p class="subtitle">Sign in to your Fresh Sip account</p>
                <form onsubmit="event.preventDefault(); window.location.href='03-dashboard.html';">
                    <div class="form-group">
                        <label>Email address</label>
                        <input type="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign In</button>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="02-register.html">Create one</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
