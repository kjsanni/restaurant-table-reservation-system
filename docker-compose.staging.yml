version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./back-end/.env
    environment:
      NODE_ENV: production
      DB_HOST: localhost
      REDIS_HOST: localhost
    volumes:
      - ./back-end/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend
    restart: unless-stopped
