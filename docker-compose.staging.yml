version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: back-end/Dockerfile
    network_mode: "host"
    env_file:
      - ./back-end/.env
    environment:
      DB_HOST: localhost
      REDIS_HOST: localhost
    volumes:
      - ./back-end/uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: front-end/Dockerfile
    network_mode: "host"
    environment:
      VITE_API_URL: /api/v1
    depends_on:
      - backend
    restart: unless-stopped
