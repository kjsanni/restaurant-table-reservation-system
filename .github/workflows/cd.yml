name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ steps.build.outputs.backend-image }}
      frontend-image: ${{ steps.build.outputs.frontend-image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Set up Podman
        run: podman --version
      - name: Generate version tag
        id: version
        run: |
          VERSION=$(node -p "require('./VERSION')")
          SHA=$(git rev-parse --short HEAD)
          echo "tag=${VERSION}-${SHA}" >> $GITHUB_OUTPUT
      - name: Build backend Podman image
        id: build
        run: |
          BACKEND_IMAGE="ghcr.io/${{ github.repository_owner }}/rtrs-backend:${{ steps.version.outputs.tag }}"
          FRONTEND_IMAGE="ghcr.io/${{ github.repository_owner }}/rtrs-frontend:${{ steps.version.outputs.tag }}"
          
          echo "backend-image=$BACKEND_IMAGE" >> $GITHUB_OUTPUT
          echo "frontend-image=$FRONTEND_IMAGE" >> $GITHUB_OUTPUT
          
          podman build -t $BACKEND_IMAGE -f back-end/Dockerfile .
          podman build -t $FRONTEND_IMAGE -f front-end/Dockerfile .
        env:
          DOCKER_BUILDKIT: 1
      - name: Log in to GitHub Container Registry
        run: podman login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
      - name: Push backend image
        run: podman push ${{ steps.build.outputs.backend-image }}
      - name: Push frontend image
        run: podman push ${{ steps.build.outputs.frontend-image }}

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USERNAME }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_PORT || 22 }}
          script: |
            cd /var/www/rtrs
            git pull origin main
            echo "${{ secrets.STAGING_ENV }}" > back-end/.env
            echo "${{ secrets.STAGING_ENV }}" > front-end/.env.production
            podman-compose -f podman-compose.yml pull
            podman-compose -f podman-compose.yml up -d --force-recreate backend frontend
            podman-compose -f podman-compose.yml exec -T backend npx sequelize db:migrate
            podman-compose -f podman-compose.yml exec -T backend npm run seed:all
            podman-compose -f podman-compose.yml exec -T backend pm2 reload ecosystem.config.js --env production
            sleep 10
            curl -f http://localhost:8000/api/v1/health || exit 1

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USERNAME }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          port: ${{ secrets.PRODUCTION_PORT || 22 }}
          script: |
            cd /var/www/rtrs
            git pull origin main
            echo "${{ secrets.PRODUCTION_ENV }}" > back-end/.env
            echo "${{ secrets.PRODUCTION_ENV }}" > front-end/.env.production
            podman-compose -f podman-compose.yml pull
            podman-compose -f podman-compose.yml up -d --force-recreate backend frontend
            podman-compose -f podman-compose.yml exec -T backend npx sequelize db:migrate
            podman-compose -f podman-compose.yml exec -T backend pm2 reload ecosystem.config.js --env production
            sleep 10
            curl -f http://localhost:8000/api/v1/health || exit 1
