# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '29 1 * * 2'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v7

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Allow pre-existing code-quality findings (JSHint, remark-lint)
          # that the CLI does not fully respect .codacy.yml engine disables for.
          # Security quality gate is enforced by the post-scan SARIF check below.
          max-allowed-issues: 2147483647

      # Enforce quality gate on security issues only (error-level in SARIF).
      # This catches new security findings without blocking on pre-existing
      # code-quality issues from engines that .codacy.yml cannot disable.
      - name: Enforce security quality gate
        run: |
          security_count=$(jq '[.runs[].results[] | select(.level == "error" or .level == "fatal") | select(.ruleId | test("^Biome_"; "i") | not)] | length' results.sarif)
          echo "Security findings (error/fatal level, excluding Biome lint): $security_count"
          if [ "$security_count" -gt 0 ]; then
            echo "::error::Codacy found $security_count security findings. See SARIF results for details."
            jq '.runs[].results[] | select(.level == "error" or .level == "fatal") | select(.ruleId | test("^Biome_"; "i") | not) | {ruleId, message: .message.text, file: .locations[0].physicalLocation.artifactLocation.uri, line: .locations[0].physicalLocation.region.line}' results.sarif
            exit 1
          fi

      # Remove non-security engine results (JSHint, remark-lint) from SARIF
      # before uploading to GitHub ASVS. These engines produce code-quality
      # findings that the CLI does not respect .codacy.yml disables for.
      - name: Filter SARIF for GitHub ASVS
        run: |
          jq '.runs |= [.[] | select(.tool.driver.name as $name | $name | test("Semgrep|Shellcheck|Hadolint|TSLint|Stylelint|Jacksonlinter"; "i"))]' results.sarif > sarif_filtered.sarif
          mv sarif_filtered.sarif results.sarif

      # Upload the SARIF file generated in the previous step
      - name: Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
