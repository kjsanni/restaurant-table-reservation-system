name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rtrs_test
          MYSQL_USER: rtrs_user
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: rtrs_test
      DB_USERNAME: rtrs_user
      DB_PASSWORD: testpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key-for-ci-only-1234567890
      CORS_ORIGINS: http://localhost:8080
      PORT: 8000
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install dependencies
        working-directory: back-end
        run: npm ci
      - name: Run database migrations
        working-directory: back-end
        run: npx sequelize db:migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rtrs_test
          DB_NAME_TEST: rtrs_test
          DB_USERNAME: rtrs_user
          DB_PASSWORD: testpass
      - name: Run backend tests
        working-directory: back-end
        run: npm test -- --forceExit --detectOpenHandles
      - name: Run security scan
        working-directory: back-end
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependencies
        working-directory: front-end
        run: npm ci
      - name: Run linter
        working-directory: front-end
        run: npm run lint
      - name: Run unit tests
        working-directory: front-end
        run: npm run test:unit
      - name: Build frontend
        working-directory: front-end
        run: npm run build

  legal-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
      - name: Check LEGAL_DOCUMENT_VERSIONS sync
        run: node scripts/check-legal-versions.js

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rtrs_test
          MYSQL_USER: rtrs_user
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: rtrs_test
      DB_NAME_TEST: rtrs_test
      DB_USERNAME: rtrs_user
      DB_PASSWORD: testpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key-for-ci-only-1234567890
      ENCRYPTION_KEY: test-encryption-key-for-ci-only
      CORS_ORIGINS: http://localhost:8080
      PORT: 8000
      ADMIN_INITIAL_PASSWORD: admin123
      RATE_LIMIT_DISABLED: true
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci
      - name: Setup Node.js environment
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json
      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci
      - name: Build frontend
        working-directory: front-end
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8000/api/v1
      - name: Install Playwright browsers
        working-directory: front-end
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run database migrations
        working-directory: back-end
        run: npx sequelize db:migrate
      - name: Seed database
        working-directory: back-end
        run: |
          npm run seed:all
          npm run seed:e2e
      - name: "Debug - inspect admin user in database"
        working-directory: back-end
        run: |
          echo "=== ALL users with admin@rtrs.com ==="
          docker exec $(docker ps -q --filter "name=mysql") mysql -u root -proot rtrs_test -e "SELECT id, email, emailVerified, tenantId, isSuperAdmin, totpEnabled FROM users WHERE email='admin@rtrs.com';" 2>&1 || true
          echo "=== ALL users by id ==="
          docker exec $(docker ps -q --filter "name=mysql") mysql -u root -proot rtrs_test -e "SELECT id, email, emailVerified, isSuperAdmin FROM users ORDER BY id;" 2>&1 || true
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rtrs_test
          DB_USERNAME: rtrs_user
          DB_PASSWORD: testpass
      - name: Start backend server
        working-directory: back-end
        run: |
          echo "PORT=$PORT"
          echo "NODE_ENV=$NODE_ENV"
          echo "REDIS_HOST=$REDIS_HOST"
          echo "REDIS_PORT=$REDIS_PORT"
          node -v
          npm -v
          ls -la node_modules/.bin/nodemon || true
          nohup node ./src/app.js > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
          echo "Server started with PID: $!"
      - name: Wait for backend
        run: |
          npx wait-on http://localhost:8000/api/v1/health --timeout 120000 || (cat /tmp/backend.log 2>/dev/null; exit 1)
      - name: Debug backend log
        if: failure()
        run: cat /tmp/backend.log 2>/dev/null || echo "No backend log found"
      - name: Run API contract tests
        working-directory: back-end
        run: npm run test:postman
        env:
          BASE_URL: http://localhost:8000
          NODE_ENV: test
      - name: Show backend log after contract tests
        if: always()
        run: cat /tmp/backend.log 2>/dev/null || echo "No backend log found"
      - name: Start frontend server
        working-directory: front-end
        run: |
          npx vite preview --port 8080 --host &
          echo $! > /tmp/frontend.pid
          echo "Frontend preview started with PID: $!"
      - name: Wait for frontend
        run: npx wait-on http://localhost:8080 --timeout 60000 || (echo "Frontend failed to start"; exit 1)
      - name: Run Playwright E2E tests
        working-directory: front-end
        run: npm run test:e2e -- --project=chromium tests/actor-entry-points.spec.ts
        env:
          BASE_URL: http://localhost:8080
