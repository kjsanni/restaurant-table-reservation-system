name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rtrs_test
          MYSQL_USER: rtrs_user
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: rtrs_test
      DB_USERNAME: rtrs_user
      DB_PASSWORD: testpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key-for-ci-only-1234567890
      CORS_ORIGINS: http://localhost:8080
      PORT: 8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install dependencies
        working-directory: back-end
        run: npm ci
      - name: Run database migrations
        working-directory: back-end
        run: npx sequelize db:migrate
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: rtrs_test
          DB_NAME_TEST: rtrs_test
          DB_USERNAME: rtrs_user
          DB_PASSWORD: testpass
      - name: Run backend tests
        working-directory: back-end
        run: npm test -- --forceExit --detectOpenHandles
      - name: Run security scan
        working-directory: back-end
        run: npm audit --audit-level=high
        continue-on-error: true

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json
      - name: Install dependencies
        working-directory: front-end
        run: npm ci
      - name: Run linter
        working-directory: front-end
        run: npm run lint
      - name: Run unit tests
        working-directory: front-end
        run: npm run test:unit
      - name: Build frontend
        working-directory: front-end
        run: npm run build

  legal-sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check LEGAL_DOCUMENT_VERSIONS sync
        run: node scripts/check-legal-versions.js

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rtrs_test
          MYSQL_USER: rtrs_user
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: rtrs_test
      DB_NAME_TEST: rtrs_test
      DB_USERNAME: rtrs_user
      DB_PASSWORD: testpass
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: test-secret-key-for-ci-only-1234567890
      CORS_ORIGINS: http://localhost:8080
      PORT: 8000
      ADMIN_INITIAL_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: back-end/package-lock.json
      - name: Install backend dependencies
        working-directory: back-end
        run: npm ci
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: front-end/package-lock.json
      - name: Install frontend dependencies
        working-directory: front-end
        run: npm ci
      - name: Build frontend
        working-directory: front-end
        run: npm run build
      - name: Install Playwright browsers
        working-directory: front-end
        run: npx playwright install --with-deps chromium
      - name: Run database migrations
        working-directory: back-end
        run: npx sequelize db:migrate
      - name: Seed database
        working-directory: back-end
        run: npm run seed:all
      - name: Start backend server
        working-directory: back-end
        run: npm run start:dev &
      - name: Wait for backend
        run: npx wait-on http://localhost:8000/api/v1/health --timeout 60000
      - name: Run API contract tests
        working-directory: back-end
        run: npm run test:postman
        env:
          BASE_URL: http://localhost:8000
          NODE_ENV: test
      - name: Run Playwright E2E tests
        working-directory: front-end
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:8000
