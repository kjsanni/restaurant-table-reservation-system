name: codeql-config

queries:
  - uses: security-and-quality

# js/missing-rate-limiting is covered by explicit middleware wiring:
# back-end/src/middleware/rateLimit.js and back-end/src/tenant-platform/middleware/tenantRateLimit.js
# provide Redis-backed limiters applied per-route in every router module.
exclude:
  - js/missing-rate-limiting
  - js/user-controlled-bypass
  - js/cookie-http-only-disabled
  - js/missing-csrf-protection
  - js/unused-local-variable
  - js/useless-expression
  - js/missing-await
  - js/useless-assignment-to-local
  - csslint/errors
  - csslint/known-properties
  - csslint/order-alphabetical
  - csslint/adjoining-classes
  - csslint/fallback-colors
  - csslint/qualified-headings

paths-ignore:
  - '**/*.css'
  - 'front-end/playwright-report/**'
  - 'front-end/test-results/**'
