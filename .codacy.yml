engines:
  jshint:
    enabled: false
  eslint:
    enabled: false
  csslint:
    enabled: false
  remark-lint:
    enabled: false
  pmd-legacy:
    enabled: false
  duplication:
    enabled: false
  stylelint:
    enabled: true
  semgrep:
    enabled: false
  shellcheck:
    enabled: true
  hadolint:
    enabled: true
  tslint:
    enabled: true
  sbom:
    enabled: false
  codeql:
    enabled: false
  metric:
    enabled: true
    exclude_paths:
      - "back-end/src/tenant-platform/controllers/tenantAdmin.controller.js"
