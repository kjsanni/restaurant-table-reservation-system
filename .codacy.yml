---
exclude_paths:
  - "back-end/src/middleware/turnstile.js"
  - "back-end/src/tenant-platform/routes/whistleblowerTip.router.js"
  - "drinks-vendor"

engines:
  jshint:
    enabled: true
    config:
      node: true
      esversion: 2020
    exclude_paths:
      - "front-end/src/**/*.vue"
      - "front-end/src/views/**/*.vue"
      - "front-end/src/components/**/*.vue"
  csslint:
    enabled: false
  stylelint:
    enabled: true
  semgrep:
    enabled: true
  codeql:
    enabled: false
